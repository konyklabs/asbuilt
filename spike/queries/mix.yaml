# The benchmark's fixed query mix, in bench/run.py's shape (see its docstring).
# Entities are named, never given as E- ids: explain and contradictions pass an
# entity's `name` from truth/entities.yaml, or, for q-explain-alias-*, one of its
# aliases; the scorer resolves both through truth/aliases.yaml, which arms never read.
# 25 explain (20 by name, 5 by alias), 17 search and 13 ask (5 of them, q-impact-*,
# are multi-hop impact questions), 4 contradictions, 3 stale; weights are percentages.
# explain: expected = every fact tagged with the resolved entity (bench/score.py).
# contradictions: expected = every X- whose facts carry the entity (every X- when null).
# stale: expected = every S- whose changed_by step is dated after `since`.
weights:
  explain: 40
  search: 25
  ask: 15
  contradictions: 10
  stale: 10
