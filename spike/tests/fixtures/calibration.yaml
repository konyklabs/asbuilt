# Matcher calibration set (konyklabs/asbuilt#7): labelled (truth, candidate,
# expect) triples for bench/score.py's `_statement_matches`, run via
# `uv run python bench/score.py --calibrate`. All content is invented for
# this fixture (Gearwell, a made-up bike-share back office — see
# ../../../AGENTS.md's cleanroom rule) and independent of truth/facts.yaml:
# these pairs exist to calibrate the matcher itself, not to restate planted
# facts. Composition: ~40 correct prose paraphrases, ~20 correct short
# subject-verb-object graph-edge-style paraphrases, ~40 hard negatives
# (polarity flip, different owner/team, different unit, near number,
# different rule on the same entity).

