# from "the ops team" apart when nothing else in the sentence differs and no
# number is involved — these three are kept, and measured as failures (see
# module docstring and this deliverable's report), specifically so that
# limitation stays visible rather than being tuned out of the set. The
# category is still represented at ~40 hard negatives overall by leaning on
# unit/near-number/different-rule variants below, which the matcher's
# number-set check *can* separate.
