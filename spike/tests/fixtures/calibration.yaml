# -- a flipped duration bound (konyklabs/asbuilt#66 item 1) ----------------
# Where both statements state a duration bound on the same number and unit,
# the directions must agree, negated or not. Each hard negative keeps the
# truth fact's words and flips only the direction word, and was credited
# before the rule. The positives state the same direction in another word
# from the same list ("past"), or a word outside the lists ("over", "older
# than"), which reads as no direction and never vetoes; "the past 7 days"
# and "over 10 minutes" are windows, not bounds beyond them. The same
# labels hold in both readings. The label rule (#66's lens round): a bound
# on the complementary event, the same boundary stated from the other side
# ("open past 24 hours" for "not docked within 24 hours", "waits at most 5
# seconds before it times out" for "times out after 5 seconds"), is a
# complement, true by meaning, refused, and pinned in tests/test_score.py's
# known-cost tests, never here; the fact's own event with its bound flipped,
# or a changed outcome or boundary, is a hard negative. A `why` gives the
