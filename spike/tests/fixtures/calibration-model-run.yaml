  candidate: When the overflow-parking flag is enabled, checking in at a station that is already at capacity
    succeeds with a 200 response returning the checked-in ride's id.
  expect: true
  candidate_claim:
    entity: checkin
    attribute: allowed_when_station_full_with_overflow_flag_enabled
    value: true
    unit: null
