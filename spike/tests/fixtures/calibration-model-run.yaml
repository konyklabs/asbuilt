# Judged pairs from the test connector's first real model run (2026-09-29,
# konyklabs/asbuilt#17): every model statement and every rules-extractor
# statement at c6 against the truth fact its test carries, with the truth's
# own claim and the candidate's claim where present, judged by hand (expect:
# true = the candidate states the fact, however fully; false = it does not),
# plus one cross pair per model statement against a different fact's truth.
# Invented fixture only (Gearwell). Run with
# `uv run python bench/score.py --calibrate tests/fixtures/calibration-model-run.yaml`.
- truth_id: F-017
  truth: A check-in at a full station is refused when the overflow_parking flag is off.
  source: model
  test: test_checkin_at_full_station_refused
  candidate: Attempting to check in at a one-capacity station that is already occupied, with the feature
    flag off, is refused with HTTP 409 and error code 'station_full'.
  expect: true
  candidate_claim:
    entity: checkin_at_full_station
    attribute: response
    value: 409 station_full
    unit: null
- truth_id: F-051
  truth: POST /rides/{id}/checkin at a full station returns HTTP 409 with error code station_full.
  source: model
  test: test_checkin_full_station_returns_409
  candidate: 'Checking in to a station that is already full returns HTTP 409 with JSON body {''error'':
    ''station_full''}.'
  expect: true
  truth_claim:
    entity: E-endpoint-checkin
    attribute: station_full_status
    value: 409
    unit: null
  candidate_claim:
    entity: checkin
    attribute: full_station_response
    value: &id001
      status: 409
      body:
        error: station_full
    unit: null
- truth_id: F-018
