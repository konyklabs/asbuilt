[project]
name = "asbuilt-spike"
version = "0.1.0"
description = "Storage-engine spike: synthetic system and benchmark harness for asbuilt (konyklabs/roadmap#153)"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# The model extractor's provider adapter (connectors/tests/extract_model.py)
# imports this lazily, never at module import time; --dry-run needs neither
# the package nor a key. `uv sync --extra model` to install it.
model = ["anthropic>=0.40"]
# The MCP adapter (mcp.py, asbuilt#9) over any bench.protocol.Prototype.
# Pinned exact (verified present on PyPI, 2026-09-28) rather than a floor,
# since this is the one dependency actual Claude Code sessions load at
# runtime, not just this repo's own tests. `uv sync --extra serve` to install
# it; `mcp.py`'s own tests use FastMCP's in-process client, no subprocess.
serve = ["fastmcp==4.0.10"]
# The shared extraction pipeline and stack B (konyklabs/asbuilt#4): the
# Postgres driver, and the pinned embedder and NLI cross-encoder (both
# imported lazily; without them the pipeline falls back to its hash
# embedder and skips the NLI pre-filter). `uv sync --extra pipeline`.
pipeline = [
    "psycopg[binary]>=3.2",
    "sentence-transformers>=6.1,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-json-report>=1.5",
    "ruff>=0.6",
    # Also declared under [project.optional-dependencies].serve (same pin) as
    # mcp.py's own runtime dependency for a plugin consumer's `uv sync --extra
    # serve`; listed again here so a plain `uv sync` in this repo already has
    # it for tests/test_mcp.py's in-process FastMCP client (asbuilt#9).
    "fastmcp==4.0.10",
    # Stack B's store tests (konyklabs/asbuilt#4): the driver, and a
    # throwaway pgvector container per test session.
    "psycopg[binary]>=3.2",
    "testcontainers>=4.15",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["."]
# The mini fixture's built system carries its own tests/test_pricing.py,
# meant to run inside the built repo (bench/runs.py), never collected here.
norecursedirs = ["fixtures", "history", "build", ".git", "node_modules"]
markers = [
    "fixture: exercises the real spike fixture (truth/, sources/, system/), not tests/fixtures/mini/; deselect with -m 'not fixture'",
    "postgres: needs Docker for a throwaway pgvector container (stack B); skipped when Docker is unavailable; deselect with -m 'not postgres'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench", "connectors", "pipeline", "prototypes"]
