[project]
name = "gearwell"
version = "0.1.0"
description = "Gearwell: an invented bike-share operator's back office (dockyard, farebox)."
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: exercises the in-process HTTP layer across dockyard and farebox",
    "unit: exercises a single function or rule in isolation",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
