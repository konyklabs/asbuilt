# The built repository's history, oldest first. build.py commits these in
# order with fixed author, committer and dates, so the SHAs are reproducible.
# Content rule (bench/build.py): system/<path> is a file's FINAL content;
# history/<step>/<path> is its content THROUGH that step, i.e. up to and
# including it. At step k a file has the overlay at the smallest step j >= k
# that has one, else the final content; an empty history/<step>/<path>.absent
# marker means the file does not exist through that step. Overlays are found
# by scanning history/; `changes`, `pull` and `note` below are informational.
