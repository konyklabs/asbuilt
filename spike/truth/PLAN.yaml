# Authoring spec for every source document, the system code, its tests and the
# test runs. Derived from truth/facts.yaml; truth/validate.py checks the two agree.
# Document ids: wiki/<slug>, doc/<id>, ticket/<key>, pull/<number>, code/<path>, run/<id>.
authoring_rules:
- Everything is invented. The only proper names allowed are Gearwell, Tollbooth Pay, Skyglass, the three service
  names and the people listed here. No real company, product, vendor or system names.
- Each document states exactly the facts listed at each anchor (wiki, doc) or location (ticket description/comment,
  PR body/comment), in natural prose, with the same numbers, units, names and qualifiers as `states`. Do not add
  qualifiers the statement lacks.
- 'Anything else a document says is noise: it must not state a value for any rule, flag, schedule, threshold, timeout,
  retry count, column name, endpoint, owner or date that appears in truth/facts.yaml.'
- 'A stale page (role: stale) states `old_value` as current and must not mention the change that superseded it.'
- A contradiction loser states its value as plain fact; the author must not hedge it or point at the other source.
- 'PR-only facts (role: PR-only) appear only in their PR comment. No code comment, docstring, test, commit message,
  ticket, wiki page or document may state that rationale.'
- Code states only code and executed facts. Docstrings may restate the code facts of the same symbol; no code comment
  may state a documented-tier fact.
- Wiki anchors are the heading slugs of the page (`## Free minutes` gives `#free-minutes`). Docs use the same convention.
- Times are America/New_York with their UTC offset; money is USD with two decimals in prose.
- A test exists in the repository exactly at the steps in its passes_in, fails_in, skipped_in and flaky_in together,
  with that outcome there (truth/planted-runs.yaml specifies the three planted ones); a symbol with per-step values
  takes each value from that step until the next listed one.
- 'Noise tickets and noise PRs (noise: true) are written like the others, about their summary only.'
